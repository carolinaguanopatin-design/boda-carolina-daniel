<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carolina & Daniel · Nuestra boda</title><meta name="description" content="¡Nos casamos! 23 de enero de 2027. Tenemos algo muy especial que compartir contigo."><meta property="og:type" content="website"><meta property="og:locale" content="es_EC"><meta property="og:title" content="Carolina & Daniel | Nuestra boda"><meta property="og:description" content="23 de enero de 2027 · Tenemos algo muy especial que compartir contigo."><meta property="og:url" content="https://carolinaguanopatin-design.github.io/boda-carolina-daniel/"><meta name="twitter:card" content="summary"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5eee2;color:#233b30;font:18px Georgia,serif;text-align:center;padding:20px}main{max-width:530px}h1{font-weight:400;font-size:clamp(42px,9vw,76px);margin:10px 0}p{line-height:1.7}small{color:#937b5e}button{padding:12px 22px;background:#233b30;color:white;border:0;cursor:pointer}</style></head><body><main><small>OCHO AÑOS SIENDO NOSOTROS</small><h1>Carolina & Daniel</h1><p id="loading">Preparando nuestra invitación...</p><button id="retry" hidden onclick="location.reload()">Volver a intentar</button></main><script>
(async()=>{
 try{
  const amount=17;
  const parts=await Promise.all(Array.from({length:amount},(_,i)=>fetch('partes/parte-'+String(i).padStart(2,'0')+'.txt').then(r=>{if(!r.ok)throw new Error('Falta bloque '+i+' ('+r.status+')');return r.text()})));
  let h=parts.join('');
  if(!h.includes('data:audio/mpeg;base64')||(h.split('data:image/').length-1)<7)throw Error('No se cargaron todos los recursos');
  h=h.replace("const guest=(p.get('nombre')||'Flor y Alfredo').trim().slice(0,120);const rawPasses=p.get('pases')||'2';","const guest=(p.get('nombre')||'').trim().slice(0,120);const rawPasses=p.get('pases')||'1';");
  h=h.replace('Vista previa: tu respuesta todavía no se envía ni se guarda en Google Sheets.','Tu confirmación quedará registrada al pulsar Enviar mi respuesta.');
  h=h.replace(/function demoRSVP\(e\)\{[\s\S]*?\n\}\n\n\/\/ Reveal content/, `function demoRSVP(e){
    e.preventDefault();
    const name=document.getElementById('guest').value.trim();
    const choice=document.querySelector('input[name="attendance"]:checked');
    const msg=document.getElementById('message').value.trim();
    const result=document.getElementById('result');
    if(!name || !choice)return;
    const qs=new URLSearchParams(location.search);
    const attendance=choice.value==='Sí asistiré'?'Sí':'No';
    const raw=Number(qs.get('pases')||1);
    const passes=Number.isInteger(raw)&&raw>=1&&raw<=15?raw:1;
    const values={nombre:name,codigo:qs.get('codigo')||'',asistencia:attendance,pases:String(passes),mensaje:msg};
    const form=document.createElement('form');
    form.method='POST';
    form.action='https://script.google.com/macros/s/AKfycbzm4IejrSQ_DLOmnyA8Tb98V-r7rC5CR_MeJc3OvJB2KDOLMeiMFS-UAqwnKTuUZZy-YQ/exec';
    form.target='_self';
    form.style.display='none';
    for(const [key,value] of Object.entries(values)){
      const field=document.createElement('input');
      field.type='hidden';field.name=key;field.value=value;form.appendChild(field);
    }
    document.body.appendChild(form);
    result.classList.remove('hidden');
    result.textContent='Enviando confirmación...';
    form.submit();
  }
  // Reveal content`);
  document.open();document.write(h);document.close();
 }catch(err){document.getElementById('loading').textContent='No se pudieron cargar todos los elementos. Comprueba tu conexión e intenta nuevamente.';document.getElementById('retry').hidden=false;console.error(err)}
})();
</script></body></html>
